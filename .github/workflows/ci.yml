name: CI

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-tests:
    name: Rust tests
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Nix comes from the shared setup-nix action, not from
      # DeterminateSystems/nix-installer-action + magic-nix-cache-action:
      # Nix is already on the self-hosted runners, and magic-nix-cache's
      # restore pipes through `xz`, which is not on the runner PATH
      # ("/bin/sh: xz: command not found"), so this step failed every job.
      # Binary-cache traffic goes through the org Attic substituter instead.
      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}

      - name: cargo check
        run: nix develop -c bash -c "cd rust && cargo check"

      - name: cargo test
        run: nix develop -c bash -c "cd rust && cargo test"

      - name: cargo check (freya-backend)
        run: nix develop -c bash -c "cd rust && cargo check --features freya-backend"

      - name: cargo test (freya-backend)
        run: nix develop -c bash -c "cd rust && cargo test --features freya-backend"

  nim-tests:
    name: Nim tests
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    steps:
      # The Nim suites compile against two sibling repositories that are not
      # part of this checkout: `nim.cfg` puts `../isonim/src` and
      # `../nim-everywhere/src` on the path. They used to come from a second
      # `actions/checkout` with `path: ../isonim`, which `actions/checkout`
      # refuses ("Repository path '.../isonim-freya/isonim' is not under
      # '.../isonim-freya/isonim-freya'"), so this job died on its second
      # step on every run, and nim-everywhere was never cloned at all.
      #
      # `setup-dev-env` clones each entry of `.github/sibling-repos` to
      # `../<name>` at the revision recorded there, and provisions Nix with
      # the shared setup-nix action (Nix is already on the self-hosted
      # runners; binary-cache traffic goes through the org Attic
      # substituter). Its token is minted from the org's CI Token Provider
      # app: the app id is an org variable, the private key a secret.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4

      - name: Setup dev env (clones .github/sibling-repos)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}

      - name: Build Rust shim
        run: nix develop -c bash -c "cd rust && cargo build"

      - name: nim check (basic)
        run: nix develop -c bash -c "nim check tests/test_basic.nim"

      - name: nim check (renderer)
        run: nix develop -c bash -c "nim check src/isonim_freya/renderer.nim"

      # Every test below loads the shim through `tools/with_shim_path.sh`,
      # which puts `<cargo target dir>/debug` on `LD_LIBRARY_PATH`. The
      # target dir is asked of cargo rather than assumed to be
      # `rust/target`: some self-hosted runners set `CARGO_TARGET_DIR` to a
      # directory outside the checkout, and there the step above succeeded
      # while each test died with "could not load: libfreya_nim_shim.so".
      - name: Run basic tests
        run: nix develop -c bash -c "./tools/with_shim_path.sh nim c -r tests/test_basic.nim"

      - name: Run renderer tests
        run: nix develop -c bash -c "./tools/with_shim_path.sh nim c -r tests/test_renderer.nim"

      - name: Run window tests
        run: nix develop -c bash -c "./tools/with_shim_path.sh nim c -r tests/test_window.nim"

      - name: Run bindings tests
        run: nix develop -c bash -c "./tools/with_shim_path.sh nim c -r tests/test_bindings.nim"

      - name: Validate Rust/Nim binding consistency
        run: nix develop -c bash -c "./tools/check_bindings.sh"

      # The same claim, enumerated in the LINKED IMAGE rather than in the
      # source text. The step above is cfg-blind and passed 48 == 48 on a
      # default build that exported 46, while the Freya launcher died at
      # load with "could not import: freya_render_to_pixels".
      - name: Validate built-shim exports against the bindings
        run: nix develop -c bash -c "./tools/check_exported_symbols.sh"

      - name: Run cross-renderer tests
        run: nix develop -c bash -c "./tools/with_shim_path.sh nim c -r --path:../isonim/src tests/test_cross_renderer.nim"

      - name: Run render integration tests
        run: nix develop -c bash -c "./tools/with_shim_path.sh nim c -r --path:../isonim/src tests/test_render_integration.nim"

      - name: Run structural comparison tests
        run: nix develop -c bash -c "./tools/with_shim_path.sh nim c -r --path:../isonim/src tests/test_structural_comparison.nim"

      # NH-M1: the reactive root seam (`renderFreya`). Runs here rather than
      # only under `just test-all`, which no workflow invokes — a verification
      # test that never runs in CI stops discriminating the moment the seam
      # regresses.
      - name: Run reactive root tests
        run: nix develop -c bash -c "./tools/with_shim_path.sh nim c -r --path:../isonim/src tests/test_render_native_freya_reactive.nim"

      # The task-manager demo's end-to-end test lives in
      # `isonim-examples/tests/test_freya_leaves_end_to_end.nim` since
      # EX-M4 (the standalone `tests/test_demo_app.nim` was deleted
      # alongside the duplicated `demos/task-manager/` source). Cross-
      # renderer parity (TUI / web / GPUI / Freya) is covered there.

      - name: Run GUI tests (render plan only)
        run: nix develop -c bash -c "./tools/with_shim_path.sh nim c -r --path:../isonim/src tests/test_gui.nim"

  gui-tests:
    name: GUI tests (headless)
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    steps:
      # Siblings and Nix: see the same steps in `nim-tests` above.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4

      - name: Setup dev env (clones .github/sibling-repos)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}

      - name: Build Rust shim (with freya-backend)
        run: nix develop -c bash -c "cd rust && cargo build --features freya-backend"

      - name: Run GUI tests under Xvfb
        run: nix develop -c bash -c "just test-gui-x11 --record"

      - name: Upload test recordings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-recordings-${{ join(matrix.runner, '-') }}
          path: target/test-recordings/
          retention-days: 7
