[package]
name = "freya-nim-shim"
version = "0.1.0"
edition = "2021"
description = "C FFI shim exposing Freya operations for IsoNim's RendererBackend"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable actual Freya rendering (requires Skia system deps).
# Without this feature, the shim provides the shadow tree and extern "C" API
# but the launch function does not start a real Freya window.
freya-backend = ["freya", "tokio"]
# RS-M14 Phase 1: enable the headless Skia raster path via freya-testing's
# `TestingHandler::create_snapshot`. Coexists with `freya-backend`; the
# windowed launch path in `freya_app.rs` is untouched. Pulls in `freya`
# (needed for `shadow_tree_app`'s RSX), `tokio` (driver for
# `wait_for_update`), `freya-testing` (the offscreen Skia surface), and
# `image` (PNG decode of the snapshot data).
freya-headless = ["freya", "tokio", "freya-testing", "image"]

[dependencies]
freya = { version = "0.3", optional = true }
tokio = { version = "1", features = ["time", "rt"], optional = true }
freya-testing = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
serial_test = "3"
serde_json = "1"
freya-testing = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
